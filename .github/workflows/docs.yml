name: docs
on:
  push:
    branches: [main]
    paths: ["docs/site/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    # GitHub Pages cannot be enabled while this repo is private (API: current plan
    # does not support Pages), so deploy-pages returns 404. Skip deploy until the
    # repo is public. github.event.repository is present for both push and
    # workflow_dispatch (repository is a required webhook field; private is set).
    if: ${{ !github.event.repository.private }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
