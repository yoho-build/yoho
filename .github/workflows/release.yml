name: release
on:
  push:
    tags: ["v*"]
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Before building: a stable tag needs docs/releases/$TAG.md with
      # "## Upgrade notes" (docs/releases/README.md).
      - name: Check release notes
        env:
          TAG: ${{ github.ref_name }}
        run: sh scripts/check-release-notes.sh --tag "$TAG"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Follow security fixes within the supported Go minor, not go.mod's
          # minimum patch. check-latest avoids an older runner-cached patch.
          go-version: '1.26.x'
          check-latest: true
      - run: go test ./...
      - run: make dist VERSION="${GITHUB_REF_NAME}"
      - run: make checksums
      - name: Attest published binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/yoho-*
          # These are Release files, not OCI images; no storage-record permission.
          create-storage-record: false
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          # The notes file goes above the generated changelog.
          notes=$(sh scripts/check-release-notes.sh --tag "$TAG")
          set -- dist/* --generate-notes
          if [ -n "$notes" ]; then set -- "$@" --notes-file "$notes"; fi
          case "$TAG" in
            *-*) set -- "$@" --prerelease ;;
          esac
          gh release create "$TAG" "$@"
