name: release
on:
  push:
    tags: ["v*"]
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Follow security fixes within the supported Go minor, not go.mod's
          # minimum patch. check-latest avoids an older runner-cached patch.
          go-version: '1.26.x'
          check-latest: true
      - run: go test ./...
      - run: make dist VERSION="${GITHUB_REF_NAME}"
      - run: make checksums
      - name: Attest published binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/yoho-*
          # These are Release files, not OCI images; no storage-record permission.
          create-storage-record: false
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          case "$GITHUB_REF_NAME" in
            *-*) gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --prerelease ;;
            *) gh release create "$GITHUB_REF_NAME" dist/* --generate-notes ;;
          esac
