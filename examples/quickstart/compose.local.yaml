# Local only: docker compose -f compose.yaml -f compose.local.yaml up --build
# Yoho does not load this file (it is not compose.override.yaml).
services:
  db:
    environment:
      POSTGRES_PASSWORD: localdev
    ports:
      - "127.0.0.1:5432:5432"
  web:
    environment:
      POSTGRES_PASSWORD: localdev
      APP_GREETING: hello-local
    ports:
      - "127.0.0.1:8080:8080"
  worker:
    environment:
      POSTGRES_PASSWORD: localdev
      APP_GREETING: hello-local
