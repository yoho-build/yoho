# Postgres primary (db on Server a) and streaming standby (db-standby on
# Server b). Both use the same image, entrypoint and hba file; the Connection
# `primary` in yoho.yml decides which one is the primary. See
# docs/site/postgres-replication.md.
x-postgres: &postgres
  image: postgres:17-alpine
  restart: unless-stopped
  stop_grace_period: 30s
  entrypoint: ["sh", "/etc/yoho-pg/entrypoint.sh"]
  command: ["postgres", "-c", "hba_file=/etc/yoho-pg/pg_hba.conf"]
  environment:
    POSTGRES_USER: postgres
    POSTGRES_DB: app
    # A subdirectory of the volume, so the entrypoint can keep its clone
    # marker on the volume but outside the data directory.
    PGDATA: /var/lib/postgresql/data/pgdata
  volumes:
    - pgdata:/var/lib/postgresql/data
    - ./entrypoint.sh:/etc/yoho-pg/entrypoint.sh:ro
    - ./pg_hba.conf:/etc/yoho-pg/pg_hba.conf:ro
    - ./initdb/10-replication.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
    interval: 2s
    timeout: 3s
    retries: 60
    start_period: 120s

services:
  web:
    image: alpine:3.22
    restart: unless-stopped
    # A demo: busybox httpd (from busybox-extras) runs CGI scripts that use
    # psql over the Connection. CGI scripts inherit the container env.
    command: ["sh", "-c", "apk add --no-cache postgresql17-client busybox-extras >/dev/null && exec busybox-extras httpd -f -v -p 8000 -h /srv/www"]
    volumes:
      - ./web:/srv/www:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/cgi-bin/health"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 60s
    x-yoho:
      # DEMO_WRITE_TOKEN guards the demo write endpoint (POST body).
      secrets: [POSTGRES_PASSWORD, DEMO_WRITE_TOKEN]
      proxy:
        hosts: [pg.example.com]
        port: 8000
        health_path: /cgi-bin/health

  db:
    <<: *postgres
    x-yoho:
      stateful: true
      secrets: [POSTGRES_PASSWORD, REPLICATOR_PASSWORD]

  db-standby:
    <<: *postgres
    x-yoho:
      stateful: true
      secrets: [POSTGRES_PASSWORD, REPLICATOR_PASSWORD]

volumes:
  pgdata:
